{% extends 'base/base.html' %}

{% block title %}Login - Shivmudra Events{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Please sign in to manage Shivmudra Events</p>
        </div>
        
        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">
                    <i class="fa-solid fa-user input-icon"></i> Username
                </label>
                <input type="text" name="username" autofocus maxlength="150" required id="id_username" class="form-control" placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="id_password">
                    <i class="fa-solid fa-key input-icon"></i> Password
                </label>
                <input type="password" name="password" required id="id_password" class="form-control" placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Sign In <i class="fa-solid fa-right-to-bracket ml-2"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}" class="auth-link">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
